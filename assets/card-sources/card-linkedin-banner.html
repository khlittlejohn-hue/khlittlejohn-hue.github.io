    background:radial-gradient(700px 320px at 88% 0%, rgba(245,196,81,.12), transparent 65%),
               radial-gradient(500px 300px at 8% 110%, rgba(245,196,81,.06), transparent 60%)}

    font-size:51px;line-height:1.26;font-weight:600;letter-spacing:-.5px}
